<style>body{text-align:left;max-width:820px;margin:0 auto;padding:1rem;font:15px/1.5 system-ui}#log{border:1px solid #888;border-radius:8px;padding:.75rem;min-height:300px;white-space:pre-wrap}.row{display:flex;gap:.5rem;margin-top:.5rem}input{flex:1;padding:.5rem}</style>
<div id="log">Pocket Agent ready. Ask me anything - I can remember facts, read web pages, and make images.</div>
<div class="row"><input id="qInput" placeholder="Ask..."><button id="askBtn">send</button></div>
<script>
const SYSTEM = "You are Pocket Agent, a helpful tool-using assistant. Reply with exactly ONE JSON object per turn: either {\"tool\":name,\"args\":{...}} or {\"final\":\"your answer\"}. Tools: remember {fact} stores a fact; recall {query} searches memory before answering anything personal; webread {url} returns page text; makeImage {prompt} generates an image and returns its URL. Keep final answers short.";
const MAX_STEPS = 8;
async function toolWebread(url) {
  try {
    const text = await root.superFetch(String(url)).then(function(r) { return r.text(); });
    return String(text).slice(0, 12000);
  } catch (e) {
    return "FETCH_ERROR:" + ((e && e.message) || e);
  }
}
async function toolRemember(fact) {
  const key = "fact-" + Date.now();
  await root.kv.agent.set(key, String(fact));
  return "stored as " + key;
}
async function toolRecall(query) {
  let entries = [];
  try {
    entries = await root.kv.agent.entries();
  } catch (e) {
    return "MEMORY_ERROR:" + ((e && e.message) || e);
  }
  const all = Array.isArray(entries) ? entries : Object.entries(entries || {});
  const words = String(query || "").toLowerCase().split(/[^a-z0-9]+/).filter(function(w) { return w.length > 2; });
  const hits = [];
  for (const pair of all) {
    const value = String(pair[1]).toLowerCase();
    if (words.some(function(w) { return value.includes(w); })) hits.push(String(pair[1]));
    if (hits.length >= 6) break;
  }
  return hits.length ? hits.join("\n---\n") : "no relevant memories";
}
async function toolMakeImage(prompt) {
  const result = await root.generateImage(String(prompt));
  return (result && (result.dataUrl || result.url)) || "IMAGE_FAILED";
}
const TOOLS = { webread: toolWebread, remember: toolRemember, recall: toolRecall, makeImage: toolMakeImage };
function responseText(raw) {
  if (!raw) return "";
  if (typeof raw === "string") return raw;
  return raw.generatedText || raw.text || raw.output || "";
}
function extractJson(text) {
  const match = String(text).match(/\{[\s\S]*\}/);
  if (!match) throw new Error("no-json");
  return JSON.parse(match[0]);
}
async function runAgent(userText) {
  const log = document.querySelector("#log");
  const input = document.querySelector("#qInput");
  input.disabled = true;
  try {
    log.textContent += "\n\nYOU: " + userText + "\nAGENT: working";
    let transcript = "System: " + SYSTEM + "\nUser: " + userText + "\n";
    for (let step = 0; step < MAX_STEPS; step++) {
      const raw = await root.generateText({
        instruction: transcript + "\nReply with exactly one JSON object (tool call or final).",
        stopSequences: ["\n\n"]
      });
      const text = responseText(raw).trim();
      transcript += "\nAgent: " + text + "\n";
      let message;
      try {
        message = extractJson(text);
      } catch (e) {
        transcript += "\nSystem: Invalid response. Reply with exactly one JSON object.";
        continue;
      }
      if (message && typeof message.final === "string") {
        log.textContent += "\n" + message.final;
        return;
      }
      if (message && message.tool && TOOLS[message.tool]) {
        const args = (message.args && typeof message.args === "object") ? message.args : {};
        let output;
        try {
          output = await TOOLS[message.tool].apply(null, Object.values(args));
        } catch (e) {
          output = "TOOL_ERROR:" + ((e && e.message) || e);
        }
        transcript += "\nSystem tool result [" + message.tool + "]: " + String(output).slice(0, 12000) + "\n";
        log.textContent += ".";
        continue;
      }
      transcript += "\nSystem: Unknown tool. Use webread, remember, recall, makeImage, or final.";
    }
    log.textContent += "\nAGENT: I ran out of steps. Please try a smaller request.";
  } finally {
    input.disabled = false;
    input.focus();
  }
}
document.querySelector("#askBtn").addEventListener("click", function() {
  const input = document.querySelector("#qInput");
  if (input.value.trim()) {
    const text = input.value;
    input.value = "";
    runAgent(text);
  }
});
document.querySelector("#qInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter") document.querySelector("#askBtn").click();
});
window.runAgent = runAgent;
</script>
